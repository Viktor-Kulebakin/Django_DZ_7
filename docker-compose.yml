version: '3.8'

services:
  # Наша база данных
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=employees_db
      - POSTGRES_USER=employees_user
      - POSTGRES_PASSWORD=employees_pass
    ports:
      - "5432:5432"

  # Наше Django приложение employees
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://employees_user:employees_pass@db:5432/employees_db
    depends_on:
      - db

volumes:
  postgres_data:
